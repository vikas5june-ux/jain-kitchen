<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f4" />
  <meta name="description" content="Jain Kitchen Operations Hub — multi-outlet restaurant operations, orders, inventory, customer CRM, people, and finance." />
  <title>Operations Hub · Jain Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="Jain Kitchen Operations Hub"><span class="brand-mark">JK</span><span class="brand-title">Jain Kitchen<small>OPERATIONS HUB</small></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="main-nav" id="mainNav" aria-label="Operations navigation">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">▦</span>Overview</button>
        <div class="nav-group-label">OPERATIONS</div>
        <button class="nav-item" data-page="orders"><span class="nav-icon">▤</span>Orders & KDS <span class="nav-count" id="newOrderCount">3</span></button>
        <button class="nav-item" data-page="pos"><span class="nav-icon">▧</span>Point of sale</button>
        <button class="nav-item" data-page="menu"><span class="nav-icon">☷</span>Menu master</button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▥</span>Inventory & buying</button>
        <div class="nav-group-label">GUESTS & TEAM</div>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customer CRM <span class="nav-dot"></span></button>
        <button class="nav-item" data-page="people"><span class="nav-icon">♧</span>People & shifts</button>
        <div class="nav-group-label">BUSINESS</div>
        <button class="nav-item" data-page="finance"><span class="nav-icon">₹</span>Finance & reports</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom"><div class="demo-pill"><span class="live-dot"></span><span><b>Demo workspace</b><small>Sample data · no live sync</small></span></div><button class="help-link" id="helpBtn">ⓘ &nbsp; Help & integrations <span>↗</span></button><div class="sidebar-user"><div class="avatar avatar-owner">VK</div><span><b>Vikas Kitchen</b><small id="sidebarRole">Owner · Super Admin</small></span><button id="roleMenuBtn" aria-label="Change demo role">⌄</button></div></div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="main-shell">
      <header class="topbar"><button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Open navigation">☰</button><div class="crumbs"><span>Jain Kitchen</span><b>/</b><strong id="pageCrumb">Overview</strong></div><div class="top-actions"><label class="outlet-select-wrap"><span class="top-label">OUTLET</span><select id="outletSelect" aria-label="Select outlet"><option value="ALL">All outlets</option><option value="BH">Banjara Hills</option><option value="JH">Jubilee Hills</option><option value="GC">Gachibowli</option><option value="CK">Central Kitchen</option></select></label><span class="top-divider"></span><button class="icon-button search-trigger" id="globalSearchBtn" aria-label="Search">⌕<kbd>⌘ K</kbd></button><button class="icon-button notification-button" id="notificationsBtn" aria-label="Notifications">♧<i></i></button><button class="profile-button" id="profileButton"><span class="avatar avatar-owner">VK</span><span class="profile-label"><b>Vikas Kitchen</b><small id="topRole">Owner</small></span><span>⌄</span></button></div></header>
      <main class="page-area" id="pageArea" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot" aria-hidden="true"></div>
  <input type="file" id="csvInput" accept=".csv,text/csv" hidden />
  <script src="app.js"></script>
</body></html>
